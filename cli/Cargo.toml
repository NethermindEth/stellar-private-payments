[package]
name = "stellar-private-payments-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "CLI for Stellar Private Payments"

[[bin]]
name = "spp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
log.workspace = true
# Pulls in reqwest's rustls TLS backend for the binary (the `stellar` crate
# depends on reqwest without a TLS feature).
reqwest = { workspace = true, features = ["blocking", "rustls"] }
serde.workspace = true
serde_json.workspace = true
stellar-private-payments = { workspace = true, features = ["encrypted-storage", "parallel"] }
toml = "1.1"
tracing = { workspace = true, features = ["attributes"] }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }

[lints]
workspace = true
