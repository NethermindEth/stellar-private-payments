name: Build and test code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPP_NETWORK: testnet
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
      # Use the released circuits when the sources match the release, with
      # the committed keys in place of a local trusted setup. Otherwise build.
      - name: Provide circuit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="circuits-v$(jq -r .version deployments/testnet/circuits.json)"
          if git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag" &&
            git diff --quiet "$tag" HEAD -- circuits tools/circuit-compiler deployments/testnet/circuits.json; then
            echo "Using $tag"
            gh release download "$tag" -p 'circuits.tar.gz*' -D "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP" && sha256sum -c circuits.tar.gz.sha256)
            mkdir -p target/circuits-artifacts testdata
            tar -xzf "$RUNNER_TEMP/circuits.tar.gz" -C target/circuits-artifacts --wildcards '*.r1cs'
            cp deployments/testnet/circuit_keys/*.bin deployments/testnet/circuit_keys/*.json testdata/
            sh deployments/scripts/circuit-artifacts.sh verify
          else
            echo "Circuits differ from $tag; building them"
            make circuits
          fi
      - name: Build examples
        run: cargo build --examples -p stellar-private-payments
      - name: Build
        run: cargo test --workspace --no-run
      - name: Run tests
        run: cargo test --workspace
