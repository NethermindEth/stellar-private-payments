name: Build and test code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPP_NETWORK: testnet
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: tests
      - name: Provide circuit artifacts
        uses: ./.github/actions/circuits
      - name: Build examples
        run: cargo build --workspace --examples
      - name: Build
        run: cargo test --workspace --no-run
      - name: Run tests
        run: cargo test --workspace

  # macOS file locking differs from Linux: flock and SQLite's fcntl locks on
  # the same file conflict there, even within one process. Run the SDK's
  # storage tests on macOS, where the CLI and wallet open their databases.
  sdk-macos:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: sdk-macos
      - name: Run SDK library tests
        run: cargo test -p stellar-private-payments --lib
