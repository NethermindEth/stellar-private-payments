name: Build and test code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPP_NETWORK: testnet
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: tests
      - name: Provide circuit artifacts
        uses: ./.github/actions/circuits
      - name: Build examples
        run: cargo build --workspace --examples
      - name: Build
        run: cargo test --workspace --no-run
      - name: Run tests
        run: cargo test --workspace
      # Run the chunked-MSM tests that need the circuit artifacts provided above.
      - name: Test the chunked-MSM prover on circuit artifacts
        run: cargo test -p stellar-private-payments --lib --features parallel -- --include-ignored chunked_msm proofs_from_every_entry_point
