name: Build and test code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPP_NETWORK: testnet
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: tests
      - name: Provide circuit artifacts
        uses: ./.github/actions/circuits
      - name: Build examples
        run: cargo build --workspace --examples
      - name: Build
        run: cargo test --workspace --no-run
      - name: Run tests
        run: cargo test --workspace
      # The workspace build has `parallel` on, which takes precedence over
      # `parallel-chunked-msm`. Test the chunked-MSM proof assembly the way a
      # threaded wasm32 build uses it, including the ignored test that needs
      # the circuit artifacts provided above.
      - name: Test the chunked-MSM prover
        run: cargo test -p stellar-private-payments --lib --features parallel-chunked-msm -- --include-ignored chunked_msm proofs_from_every_entry_point
