name: Build and test ignored code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    timeout-minutes: 480
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: ignored
      # compiled under --release for faster run times
      - name: Build circuit artifacts
        run: make circuits TESTS=1
      - name: Build
        run: cargo test --release --workspace --no-run
      - name: Run tests
        run: cargo test --release --workspace -- --ignored
