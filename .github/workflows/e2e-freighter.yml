name: E2E Freighter

# Smoke subset on every PR; the whole suite on demand from the Actions tab.
#
# Both build the app from this checkout and serve it on localhost:8000. An
# earlier version pointed the PR-time run at the deployed GitHub Pages app,
# which meant a PR was tested against whatever happened to be deployed rather
# than against its own code — a green tick that said nothing about the change.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The suite drives four shared testnet accounts against one pool: it deposits,
# withdraws, and asserts on balances and nullifier state. Two runs at once
# spend each other's notes and fail in ways that look like product bugs, so
# runs queue instead of overlapping. Not cancel-in-progress: a half-finished
# run leaves on-chain state behind, so it is better to let it finish.
concurrency:
  group: e2e-freighter-testnet
  cancel-in-progress: false

jobs:
  e2e-freighter:
    name: Freighter e2e
    runs-on: ubuntu-latest
    environment: e2e-testnet
    timeout-minutes: 75
    steps:
      - name: Checkout source code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-unknown-unknown
          override: true

      - name: Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          cache-targets: "true"

      - name: Install Trunk
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2
        with:
          tool: trunk@0.21.14

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked --force

      - name: Setup Node.js
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e-freighter/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci --prefix e2e-freighter
          cd e2e-freighter && npx playwright install ffmpeg

      - name: Locate Chromium
        run: |
          CHROMIUM_PATH=$(command -v chromium || command -v google-chrome || echo "")
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "Error: Neither chromium nor google-chrome found in PATH" >&2
            exit 1
          fi
          echo "E2E_CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      # The profile is generated fresh on every run — nothing is stored in
      # releases, caches, or the repo. setup.sh's headed steps (Freighter
      # provisioning, app onboarding wizard) get a virtual display from xvfb.
      - name: Generate Freighter profile snapshot
        env:
          E2E_FREIGHTER_PASSWORD: ${{ secrets.E2E_FREIGHTER_PASSWORD }}
          E2E_ACCOUNT_C_SECRET: ${{ secrets.E2E_ACCOUNT_C_SECRET }}
          E2E_ACCOUNT_C_ADDRESS: ${{ secrets.E2E_ACCOUNT_C_ADDRESS }}
        run: xvfb-run -a bash e2e-freighter/scripts/setup.sh

      # Empty = the whole suite. run-all.sh takes the subset as arguments.
      - name: Select tests
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tests=e2e-freighter/tests/01-connect.mjs e2e-freighter/tests/03-rejection.mjs e2e-freighter/tests/05-deposit-transfer.mjs" >> "$GITHUB_OUTPUT"
          else
            echo "tests=" >> "$GITHUB_OUTPUT"
          fi

      # serve-and-run.sh builds and serves the app (make serve), waits for the
      # port, runs the tests, and stops the server afterwards — the same path
      # `make freighter-e2e` uses locally, so CI and a developer's machine
      # exercise identical wiring.
      #
      # run-all.sh runs scripts/e2e-preflight.sh --check --suite freighter once
      # before the tests. No .e2e-accounts.env exists here — every var below is
      # an injected secret instead, so the preflight's env-file checks SKIP when
      # CI is detected while env.vars.required still verifies against the
      # environment for real. chain.accounts.* SKIP on CI, trusting the account
      # state a human verified once before copying the secrets in.
      - name: Run Freighter tests
        env:
          APPROVE: auto
          E2E_FREIGHTER_PASSWORD: ${{ secrets.E2E_FREIGHTER_PASSWORD }}
          # Transfer recipient for 05/10/11 (registered address). No env file
          # exists in CI, so every var a test reads must be set here.
          E2E_ACCOUNT_D_ADDRESS: ${{ secrets.E2E_ACCOUNT_D_ADDRESS }}
          # A cold CI build (circuits + wasm SDK) is slower than a warm local one.
          E2E_SERVE_TIMEOUT: "1800"
        run: bash e2e-freighter/scripts/serve-and-run.sh ${{ steps.select.outputs.tests }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: freighter-test-results
          path: e2e-freighter/test-results/
          retention-days: 30
