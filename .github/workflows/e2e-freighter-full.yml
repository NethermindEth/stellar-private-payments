name: E2E Freighter Full Suite

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-freighter-full:
    name: Full Freighter test suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: e2e-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-unknown-unknown
          override: true

      - name: Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          cache-targets: "true"

      - name: Cache binaryen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/binaryen/binaryen-version_131
          key: binaryen-version_131-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Node.js
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e-freighter/package-lock.json

      - name: Install Trunk
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2
        with:
          tool: trunk@0.21.14

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked --force

      - name: Build app (Trunk)
        run: |
          rm -rf app-dist
          make release DIST_DIR=app-dist

      - name: Start app server
        run: |
          python3 -m http.server 8000 -d app-dist &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "App server ready"
              exit 0
            fi
            sleep 1
          done

          echo "App server failed to start" >&2
          exit 1

      - name: Install test dependencies
        run: |
          npm ci --prefix e2e-freighter
          # The runner records video when $CI is set (runner.mjs), and
          # Playwright video needs its own ffmpeg build — not part of npm ci.
          cd e2e-freighter && npx playwright install ffmpeg

      - name: Locate Chromium
        run: |
          CHROMIUM_PATH=$(command -v chromium || command -v google-chrome || echo "")
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "Error: Neither chromium nor google-chrome found in PATH" >&2
            exit 1
          fi
          echo "E2E_CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      # The profile is generated fresh on every run — nothing is stored in
      # releases, caches, or the repo. setup.sh's headed steps (Freighter
      # provisioning, app onboarding wizard) get a virtual display from xvfb.
      - name: Generate Freighter profile snapshot
        env:
          E2E_FREIGHTER_PASSWORD: ${{ secrets.E2E_FREIGHTER_PASSWORD }}
          E2E_ACCOUNT_C_SECRET: ${{ secrets.E2E_ACCOUNT_C_SECRET }}
          E2E_ACCOUNT_C_ADDRESS: ${{ secrets.E2E_ACCOUNT_C_ADDRESS }}
        run: xvfb-run -a bash e2e-freighter/scripts/setup.sh

      - name: Run full Freighter test suite
        env:
          E2E_FREIGHTER_PASSWORD: ${{ secrets.E2E_FREIGHTER_PASSWORD }}
          # Transfer recipient for 05/10/11 (registered address). No env
          # file exists in CI, so every var a test reads must be set here.
          E2E_ACCOUNT_D_ADDRESS: ${{ secrets.E2E_ACCOUNT_D_ADDRESS }}
        run: APPROVE=auto APP_URL=http://localhost:8000 bash e2e-freighter/scripts/run-all.sh

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: freighter-test-results
          path: e2e-freighter/test-results/
          retention-days: 30
