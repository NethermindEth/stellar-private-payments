name: Dependency security audit

on:
  push:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  security_audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Cache audit-check build
        id: cache-audit-check
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run audit-check action
        run: |
          which cargo-deny || cargo install cargo-deny --locked --version 0.20.2
          cargo deny check

      - name: Flag ignored ruzstd advisory
        if: always()
        run: |
          versions=$(awk '/^name = "ruzstd"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          vulnerable=$(printf '%s\n' $versions | awk -F. 'NF && ($1 == 0 && ($2 < 9 || ($2 == 9 && $3 < 1)))')
          if [ -n "$vulnerable" ]; then
            echo "::warning title=RUSTSEC-2026-0344 ignored::ruzstd $vulnerable is vulnerable (decompression bomb, fixed in 0.9.1). It comes from wasmer 7.2's object 0.39; newer wasmer needs arbitrary ^1.4, which soroban-sdk's ~1.3.0 pin blocks. Upgrade once soroban-sdk relaxes the pin."
          else
            echo "::warning title=RUSTSEC-2026-0344 resolved::Cargo.lock no longer contains a vulnerable ruzstd. Remove RUSTSEC-2026-0344 from deny.toml and this step."
          fi
