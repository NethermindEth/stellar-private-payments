name: Deployment Verify

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to check"
        default: testnet
  pull_request:
    branches: ["main"]
    paths:
      - "deployments/*/deployments.json"
      - "deployments/scripts/verify-deployment.sh"
      - ".github/workflows/deployment-verify.yml"
  push:
    branches: ["main"]
    paths:
      - "deployments/*/deployments.json"
      - "deployments/scripts/verify-deployment.sh"
      - ".github/workflows/deployment-verify.yml"

permissions:
  contents: read

jobs:
  verify-deployment:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: v28.1.0

      # The CLI's mainnet network has no RPC URL; CI uses the MAINNET_RPC_URL repository variable.
      - name: Add the mainnet RPC
        if: vars.MAINNET_RPC_URL != ''
        env:
          MAINNET_RPC_URL: ${{ vars.MAINNET_RPC_URL }}
        run: |
          stellar network add mainnet --rpc-url "$MAINNET_RPC_URL" \
            --network-passphrase "Public Global Stellar Network ; September 2015"

      # With no network named, check every manifest, since the trigger fires on any of them.
      # The input reaches the shell as an environment variable, never as interpolated source.
      # On a pull request, the base branch's manifest tells the check which allowlists it adds.
      - name: Verify deployment
        env:
          NETWORK: ${{ inputs.network }}
          MAINNET_RPC_URL: ${{ vars.MAINNET_RPC_URL }}
        run: |
          verify() {
            local base=() file="$RUNNER_TEMP/$1.json"
            if [[ -n "$GITHUB_BASE_REF" ]] \
              && git show "origin/$GITHUB_BASE_REF:deployments/$1/deployments.json" >"$file"; then
              base=(--base-manifest "$file")
            fi
            if [[ "$1" == mainnet && -z "$MAINNET_RPC_URL" ]]; then
              echo "::notice::Skipped mainnet: no MAINNET_RPC_URL repository variable names an RPC"
            else
              deployments/scripts/verify-deployment.sh "$1" "${base[@]}"
            fi
          }
          if [[ -n "$NETWORK" ]]; then
            verify "$NETWORK"
          else
            status=0
            for manifest in deployments/*/deployments.json; do
              verify "$(basename "$(dirname "$manifest")")" || status=1
            done
            exit "$status"
          fi
