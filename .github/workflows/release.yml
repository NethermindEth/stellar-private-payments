# Release pipeline: PR dry runs → merge to main → prepare, tag, and publish.
# Build jobs are read-only and shared by PR validation and actual releases.
# Pushes check registries before preparation; PRs always exercise preparation.
#
# Configure trusted publishers (workflow file must be release.yml):
#   - crates.io: stellar-private-payments
#   - npm: stellar-private-payments
name: Release

on:
  # Run from main after an orchestration fix. retry checks the immutable tag
  # against HEAD and rejects product changes; already-published packages skip.
  workflow_dispatch:
    inputs:
      package:
        description: Retry the current tagged version (release orchestration fixes only)
        required: true
        type: choice
        options: [sdk, npm, cli]
  pull_request:
    branches: ["main"]
    paths:
      - "sdk/**"
      - "cli/**"
      - "circuits/**"
      - "circuit-keys/**"
      - "contracts/**"
      - "tools/circuit-compiler/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Makefile"
      - "scripts/**"
      - "deployments/**"
      - "app/package-lock.json"
      - "LICENSE"
      - ".github/workflows/release.yml"
  push:
    branches: ["main"]
    # Keep ordinary source merges out of the release concurrency queue.
    paths:
      - "sdk/native/Cargo.toml"
      - "sdk/web/package.json"
      - "cli/Cargo.toml"
      - "Cargo.toml"
      - "scripts/release-versions.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: sh scripts/release-versions.sh check
      - run: bash scripts/test-release-versions.sh
      - id: sdk
        run: |
          if git diff "${{ github.event.pull_request.base.sha }}" HEAD -- sdk/native/Cargo.toml \
               | grep -q '^+version = '; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify SDK version bump matches API changes
        if: steps.sdk.outputs.bump == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2
        with:
          package: stellar-private-payments
          manifest-path: sdk/native/Cargo.toml
          verbose: true

  plan:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Select packages for release validation
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.plan.outputs.publish_sdk }}
      npm: ${{ steps.plan.outputs.publish_npm }}
      cli: ${{ steps.plan.outputs.publish_cli }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RETRY_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            sh scripts/release-versions.sh plan all
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            sh scripts/release-versions.sh retry "$RETRY_PACKAGE"
          else
            sh scripts/release-versions.sh plan changed
          fi

  tag:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sdk: ${{ steps.tag.outputs.publish_sdk }}
      npm: ${{ steps.tag.outputs.publish_npm }}
      cli: ${{ steps.tag.outputs.publish_cli }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RETRY_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            sh scripts/release-versions.sh retry "$RETRY_PACKAGE"
          else
            sh scripts/release-versions.sh tag
          fi

  sdk:
    name: Validate Rust SDK package
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    needs: plan
    if: needs.plan.outputs.sdk != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Skip if already on crates.io
        id: registry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif sh scripts/release-versions.sh published sdk '${{ needs.plan.outputs.sdk }}'; then
            echo "already on crates.io — skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        if: steps.registry.outputs.publish == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        if: steps.registry.outputs.publish == 'true'
      - name: Dry-run crates.io publication
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish --dry-run -p stellar-private-payments --locked

  npm:
    name: Build and validate npm package
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    needs: plan
    if: needs.plan.outputs.npm != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/web
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - name: Skip if already on npm
        id: registry
        env:
          EVENT_NAME: ${{ github.event_name }}
        working-directory: .
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif sh scripts/release-versions.sh published npm '${{ needs.plan.outputs.npm }}'; then
            echo "already on npm — skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        if: steps.registry.outputs.publish == 'true'
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: steps.registry.outputs.publish == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --force
        working-directory: .
      - name: Prepare canonical circuit keys
        if: steps.registry.outputs.publish == 'true'
        working-directory: .
        run: |
          mkdir -p testdata
          cp deployments/testnet/circuit_keys/*.bin testdata/
          cp deployments/testnet/circuit_keys/*.json testdata/
      - name: Build circuit artifacts
        if: steps.registry.outputs.publish == 'true'
        working-directory: .
        run: make circuits
      - if: steps.registry.outputs.publish == 'true'
        run: npm ci
      - if: steps.registry.outputs.publish == 'true'
        run: npm run build
      - if: steps.registry.outputs.publish == 'true'
        run: npm run check:artifacts && npm run check:bindgen && npm run check:types && npm run check:package
      - name: Dry-run npm packaging
        if: steps.registry.outputs.publish == 'true'
        run: npm pack --dry-run --ignore-scripts
      - name: Pack the validated npm package
        if: steps.registry.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: steps.registry.outputs.publish == 'true'
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  cli-ready:
    needs: plan
    if: needs.plan.outputs.cli != ''
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Skip if GitHub release already has assets
        id: registry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif sh scripts/release-versions.sh published cli '${{ needs.plan.outputs.cli }}'; then
            echo "GitHub release already published — skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  cli-dist:
    needs: [plan, cli-ready]
    if: needs.cli-ready.outputs.publish == 'true'
    name: Build dist bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ format('cli-v{0}', needs.plan.outputs.cli) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the actual build version; dtolnay only
      # sets the rustup default, which that file overrides.
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2

      - name: Verify tag matches crate version
        run: |
          set -eu
          crate_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)"
          tag="${RELEASE_TAG}"
          expected="${tag#cli-v}"
          echo "tag=$tag crate_version=$crate_ver expected=$expected"
          if [ "$expected" != "$crate_ver" ]; then
            echo "::error::tag $tag does not match cli crate version $crate_ver (expected cli-v$crate_ver)"
            exit 1
          fi

      - name: Provide canonical keys (skip trusted setup)
        run: |
          mkdir -p testdata
          cp deployments/testnet/circuit_keys/*.bin testdata/
          cp deployments/testnet/circuit_keys/*.json testdata/

      - name: Build circuits (release) — produces r1cs
        run: make circuits

      - name: Assemble dist
        run: |
          set -eu
          STAGING="$(mktemp -d)"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/source-bundle.tar.gz"

          # Legal set: LICENSE.txt, NOTICE.txt, licenses/{LGPL,GPL}, circuits/NOTICE.txt.
          sh deployments/scripts/stage-dist-legal.sh "$STAGING" "$BUNDLE_URL"
          # The CLI dist mirrors the app layout minus the disclaimer file.
          rm -f "$STAGING/DISCLAIMER.txt"

          # Compiled circuit artifacts + proving keys / witness graphs the CLI loads.
          CIRCUITS="target/circuits-artifacts"
          KEYS="deployments/testnet/circuit_keys"
          cp deployments/testnet/circuits.json "$STAGING/circuits.json"
          for stem in $(jq -r 'keys[] | select(. != "meta" and . != "version")' deployments/testnet/circuits.json); do
            cp "$CIRCUITS/${stem}.r1cs" "$STAGING/circuits/"
            cp "$KEYS/${stem}.graph.bin" "$STAGING/circuits/"
            cp "$KEYS/${stem}_proving_key.bin" "$STAGING/circuits/"
          done

          # Corresponding Source bundle (LGPL-3.0).
          sh deployments/scripts/package-circuits-source-bundle.sh "$STAGING/circuits/source-bundle.tar.gz"

          mkdir -p out
          tar -C "$STAGING" -czf out/dist.tar.gz .
          cp "$STAGING/circuits/source-bundle.tar.gz" out/source-bundle.tar.gz
          for f in dist.tar.gz source-bundle.tar.gz; do
            sha256sum "out/$f" | sed "s| out/| |" > "out/$f.sha256"
          done
          ls -l out

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: out/*

  build-cli:
    needs: [plan, cli-ready]
    if: needs.cli-ready.outputs.publish == 'true'
    name: Build spp (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the actual build version; dtolnay only
      # sets the rustup default, which that file overrides.
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      # cross supplies the musl toolchains inside its containers. Native
      # Linux and macOS builds use the repository's Rust toolchain.
      - name: Add target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          key: ${{ matrix.target }}

      - name: Prepare circuits inputs (avoid in-build git fetch / keygen)
        shell: bash
        run: |
          set -eu
          # Check out circomlib at the locked rev so tools/circuit-compiler skips fetching.
          LOCK="$(tr -d '[:space:]' < circuits/circomlib.lock)"
          if [ ! -d circuits/src/circomlib/.git ]; then
            git clone https://github.com/iden3/circomlib.git circuits/src/circomlib
          fi
          git -C circuits/src/circomlib fetch --depth 1 origin "$LOCK"
          git -C circuits/src/circomlib checkout --detach FETCH_HEAD
          # Canonical keys so circuit-compiler does not run a (random) trusted setup.
          mkdir -p testdata
          cp deployments/testnet/circuit_keys/*.bin testdata/
          cp deployments/testnet/circuit_keys/*.json testdata/

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2
        with:
          tool: cross

      - name: Build with required SQLite3MC
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked -p stellar-private-payments-cli --bin spp --release --target ${{ matrix.target }}
          else
            cargo build --locked -p stellar-private-payments-cli --bin spp --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p out
          BIN="target/${{ matrix.target }}/release/spp"
          test -f "$BIN"
          tar -C "$(dirname "$BIN")" -czf "out/spp-${{ matrix.target }}.tar.gz" spp
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "spp-${{ matrix.target }}.tar.gz" > "spp-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "spp-${{ matrix.target }}.tar.gz" > "spp-${{ matrix.target }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: spp-${{ matrix.target }}
          path: out/*

  cli-assets:
    name: Validate CLI release assets
    needs: [cli-ready, cli-dist, build-cli]
    if: needs.cli-ready.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: spp-*
          path: artifacts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: artifacts/dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -l out

      - name: Verify complete CLI asset set and checksums
        run: |
          cd out
          for asset in dist.tar.gz source-bundle.tar.gz \
            spp-x86_64-unknown-linux-musl.tar.gz spp-aarch64-unknown-linux-musl.tar.gz \
            spp-x86_64-apple-darwin.tar.gz spp-aarch64-apple-darwin.tar.gz; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum -c "$asset.sha256"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cli-release
          path: out/*
          if-no-files-found: error

  sdk-publish:
    needs: [tag, sdk]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.sdk.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: cargo publish -p stellar-private-payments --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm-publish:
    needs: [tag, npm]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.npm.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/*.tgz --ignore-scripts --provenance

  cli-github-release:
    name: GitHub Release
    needs: [tag, cli-ready, cli-assets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.cli-ready.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ format('cli-v{0}', needs.tag.outputs.cli) }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cli-release
          path: out

      - name: Determine prerelease
        id: pre
        run: |
          case "${RELEASE_TAG}" in
            cli-v*-* ) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            * )        echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*
          prerelease: ${{ steps.pre.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Install CLI

            ```bash
            curl -fsSL https://nethermindeth.github.io/stellar-private-payments/install.sh | sh -s -- --version ${{ env.RELEASE_TAG }}
            ```
          fail_on_unmatched_files: true
