name: Linter check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Let main finish saving caches; cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Make sure CI fails on all warnings, including Clippy lints
  RUSTFLAGS: "-Dwarnings"

jobs:
  linter_check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
    
      - name: Install cargo-shear
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2
        with:
          tool: cargo-shear@1.11.2
      - name: Check for unused dependencies
        run: cargo shear

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: clippy
      # Pin rustfmt: rust-cache includes every installed compiler in its key.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly-2026-10-17 --component rustfmt --profile minimal
      - uses: ./.github/actions/rust-cache
      - name: Provide circuit artifacts
        uses: ./.github/actions/circuits
      - name: Run Fmt
        run: cargo +nightly-2026-10-17 fmt --all -- --check --config-path rustfmt.toml

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Check typos
        uses: crate-ci/typos@bb4666ad77b539a6b4ce4eda7ebb6de553704021 # v1.42.0
