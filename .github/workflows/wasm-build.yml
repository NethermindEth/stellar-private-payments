name: WASM Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm-build:
    env:
      SPP_NETWORK: testnet
    # The threaded prover worker and the prover test add a few minutes.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-unknown-unknown
          override: true

      # The threaded prover worker rebuilds std from source. rustup takes the
      # toolchain from rust-toolchain.toml, which lists rust-src; make sure.
      - name: Install rust-src for the threaded prover worker
        run: rustup component add rust-src

      # Also keeps target/web-threads, the threaded worker's std and dependencies.
      - name: Cache
        uses: ./.github/actions/rust-cache
        with:
          cache-targets: "true"

      - name: Provide circuit artifacts
        uses: ./.github/actions/circuits

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --force

      - name: Setup Node.js
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json

      # Rust network validation tests already run in cargo test --workspace.
      - name: Test app network and runtime configuration
        run: node --test integration-tests-app/tests/unit/network-config.test.mjs integration-tests-app/tests/unit/sdk-runtime-config.test.mjs

      - name: Install SDK npm dependencies
        run: npm ci --prefix sdk/web

      # On a miss build.sh downloads and sha256-verifies binaryen itself; this
      # only persists the extracted tree between runs.
      - name: Cache binaryen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/binaryen/binaryen-version_131
          key: binaryen-version_131-${{ runner.os }}-${{ runner.arch }}

      - name: Build npm package
        run: npm run build --prefix sdk/web

      - name: Check SDK artifacts and types
        run: |
          npm run check:artifacts --prefix sdk/web
          npm run check:bindgen --prefix sdk/web
          npm run check:types --prefix sdk/web

      # Proves on the threaded worker of an isolated page and on the serial
      # worker of a page that is not isolated.
      - name: Test the prover workers in Chromium
        run: node sdk/web/scripts/test-prover-threads.js --binary "$(command -v google-chrome)" --driver "$CHROMEWEBDRIVER/chromedriver" --artifacts "$RUNNER_TEMP/prover-checks/chromium"

      - name: Test SDK amount bindings
        run: npm run test:amounts --prefix sdk/web

      - name: Install app npm dependencies
        run: npm ci --prefix app

      - name: Test app units
        run: |
          npm ci --prefix integration-tests-app
          npm run test:unit --prefix integration-tests-app

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Smoke-test Trunk app build
        run: trunk build --release --dist /tmp/app-dist

      # Reuse the built SDK; only deployment selection and JS bundling vary.
      - name: Smoke-test alternate network selection
        env:
          SPP_NETWORK: local
          TRUNK_STAGING_DIR: /tmp/app-local-dist
        run: |
          mkdir -p deployments/local
          jq '.network = "local" | .networkPassphrase = "Standalone Network ; February 2017" | .rpcUrl = "http://localhost:8000/rpc"' \
            deployments/testnet/deployments.json > deployments/local/deployments.json
          ln -s ../testnet/circuit_keys deployments/local/circuit_keys
          ln -s ../testnet/circuits.json deployments/local/circuits.json
          sh deployments/scripts/circuit-artifacts.sh verify
          sh deployments/scripts/bundle-app.sh
          cmp deployments/local/deployments.json "$TRUNK_STAGING_DIR/deployments.json"

  wasm-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-unknown-unknown
          override: true

      - name: Cache
        uses: ./.github/actions/rust-cache
        with:
          cache-targets: "true"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --force

      # The threaded prover worker builds `parallel-chunked-msm` with atomics
      # (wasm-build job); keep it compiling, warning-free, without them too.
      # `parallel` is not checked here: its MSM cannot run on wasm32.
      - name: Check the parallel-chunked-msm feature on wasm32
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo check --target wasm32-unknown-unknown -p stellar-private-payments --features parallel-chunked-msm

      - name: Run wasm tests
        run: cargo test --target wasm32-unknown-unknown -p stellar-private-payments --lib
