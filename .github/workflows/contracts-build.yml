name: Contracts Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-contracts:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2

      - name: Check that each vk-* feature embeds its own key file
        run: bash scripts/test-verifier-features.sh

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: v28.1.0

      - name: Test build-contracts.sh's refusals
        run: bash scripts/test-build-contracts.sh

      - name: Build contracts
        run: scripts/build-contracts.sh --out "$RUNNER_TEMP/contracts"

      - name: Test deploy.sh's release refusals
        run: bash scripts/test-deploy-release.sh "$RUNNER_TEMP/contracts"

      - name: Rebuild contracts and compare hashes
        run: scripts/build-contracts.sh --rebuild "$RUNNER_TEMP/contracts"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: contracts
          path: ${{ runner.temp }}/contracts
