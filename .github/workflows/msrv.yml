name: MSRV check

on:
  push:
    branches: ["main"]
    paths: ["**/Cargo.toml", "**/Cargo.lock", "rust-toolchain.toml"]
  pull_request:
    branches: ["main"]
    paths: ["**/Cargo.toml", "**/Cargo.lock", "rust-toolchain.toml"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  msrv:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      # The workspace declares rust-version = "1.97.1"; this job must run on
      # that exact floor. dtolnay/rust-toolchain has no override input, so an
      # explicit `rustup override set` beats the rust-toolchain.toml pin —
      # when the pin moves ahead of the MSRV, this job still checks the floor.
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: "1.97.1"

      - name: Pin the MSRV toolchain over rust-toolchain.toml
        run: rustup override set 1.97.1

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2

      - name: Check workspace on MSRV
        run: cargo check --workspace --locked
