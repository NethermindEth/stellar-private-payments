name: MSRV

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surface: [native, browser, contracts]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      # Native test binaries pull in Wasmer/Cranelift; debug symbols dominate disk use.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Test policy validation
        if: matrix.surface == 'native'
        run: bash scripts/test-msrv.sh
      - name: Read and validate MSRV declarations
        id: policy
        run: |
          version=$(bash scripts/msrv.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the minimum compiler and target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.policy.outputs.version }}
          targets: ${{ matrix.surface == 'browser' && 'wasm32-unknown-unknown' || matrix.surface == 'contracts' && 'wasm32v1-none' || '' }}
      - name: Select the minimum compiler, including subprocesses
        run: echo 'RUSTUP_TOOLCHAIN=${{ steps.policy.outputs.version }}' >> "$GITHUB_ENV"
      - name: Show effective compiler
        run: |
          rustc --version --verbose
          cargo --version
      - name: Install contract build tooling
        if: matrix.surface == 'contracts'
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: v28.1.0
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          key: msrv-${{ matrix.surface }}
      - name: Verify supported build surface
        run: bash scripts/check-msrv.sh '${{ matrix.surface }}'
