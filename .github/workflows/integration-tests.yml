name: Integration tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  integration-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --profile minimal

      - name: Install System dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install wasm target
        run: rustup target add wasm32v1-none

      - name: Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          workspaces: |
            .
            integration-tests
          cache-targets: "true"

      - name: Run Fmt
        working-directory: integration-tests
        run: cargo +nightly fmt --all -- --check --config-path ../rustfmt.toml

      - name: Run Clippy
        working-directory: integration-tests
        run: cargo clippy --all-targets

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: v28.1.0

      - name: Provide canonical keys (skip trusted setup)
        run: |
          mkdir -p testdata
          cp deployments/testnet/circuit_keys/*.bin testdata/
          cp deployments/testnet/circuit_keys/*.json testdata/

      - name: Build circuit artifacts
        run: make circuits

      - name: Provide canonical graphs and proving keys
        run: |
          cp deployments/testnet/circuit_keys/*.graph.bin target/circuits-artifacts/
          cp deployments/testnet/circuit_keys/*_proving_key.bin target/circuits-artifacts/

      - name: Run integration tests
        run: make integration-tests
