name: Bootnode CI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/bootnode/**"
      - "deployments/**"
      - "sdk/native/**"
      - ".github/workflows/bootnode-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/bootnode/**"
      - "deployments/**"
      - "sdk/native/**"
      - ".github/workflows/bootnode-ci.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  bootnode:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bootnode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install cargo-shear
        uses: taiki-e/install-action@541dbe11e2898b05bb65bedbd1d0c4e3092b5bdd # v2.67.29
        with:
          tool: cargo-shear@1.11.2

      - name: Check for unused dependencies
        run: cargo shear

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --profile minimal

      - uses: ./.github/actions/rust-cache
        with:
          workspaces: tools/bootnode

      - name: Install cargo-deny
        run: which cargo-deny || cargo install cargo-deny --locked --version 0.20.2

      - name: Dependency audit
        run: cargo deny --config ../../deny.toml check

      - name: Fmt
        run: cargo +nightly fmt --all -- --check --config-path ../../rustfmt.toml

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test