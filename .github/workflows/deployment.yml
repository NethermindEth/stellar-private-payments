name: Deployment

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Site
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2

      - name: Setup pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install mdBook
        run: cargo install mdbook --no-default-features

      - name: Cache binaryen and wasm-opt output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/tmp/binaryen
            target/tmp/witness-opt-cache
          key: binaryen-${{ runner.os }}-${{ runner.arch }}-version_131-bulk-memory-reference-types-multivalue-sign-ext-nontrapping-float-to-int-mutable-globals

      - name: Install wasm build prerequisites
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked --force

      - name: Build app (Trunk)
        run: |
          rm -rf site
          make release DIST_DIR=site PUBLIC_URL="${{ steps.pages.outputs.base_url }}/"

      - name: Publish install script
        run: cp scripts/install.sh site/install.sh

      - name: Resolve symlinks in docs
        run: |
          cd docs/src
          for f in *.md; do
            if [ -L "$f" ]; then
              cp --remove-destination "$(readlink -f "$f")" "$f"
            fi
          done

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_url }}/docs/
        run: mdbook build docs/

      - name: Build API documentation
        run: cargo doc --no-deps --workspace --release

      - name: Combine outputs
        run: |
          rm -f target/doc/.lock
          mkdir -p site/docs/api
          cp -r docs/book/* site/docs/
          cp -r target/doc/* site/docs/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # Browser e2e smoke test of the web client against testnet (issue #168).
  # Gates deployment: `publish` needs this job, so a regression blocks the Pages
  # deploy rather than every PR — testnet/friendbot flakiness must not block
  # merges.
  #
  # Required secrets (protected `e2e-testnet` environment, so only main-branch
  # runs can read them). Provision once, locally, with
  # `deployments/scripts/e2e-accounts-setup.sh`, then copy from the generated
  # deployments/testnet/.e2e-accounts.env — long-lived accounts are reused
  # rather than friendbot-funded per run:
  #   E2E_ACCOUNT_A_ADDRESS  G… address of test account A
  #   E2E_ACCOUNT_A_SECRET   S… secret for A (signs the seeding deposits only)
  #   E2E_ACCOUNT_B_ADDRESS  G… address of test account B (transfer recipient)
  # Both accounts must be registered in the public-key registry, which the
  # provisioning script does. No ASP membership and no admin secret are needed:
  # the target pool's policyFlags are ["blocklist"], so membership proofs are not
  # required (they are Allowlist-gated — sdk/types/src/policy_tx.rs; the pool's
  # flags are in deployments/testnet/deployments.json).
  e2e:
    name: Browser e2e (web client)
    permissions:
      contents: read
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: e2e-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-unknown-unknown
          override: true

      - name: Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
        with:
          cache-targets: "true"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked --force

      - name: Setup Node.js
        uses: actions/setup-node@6a61c0375d66246de94630495909f12cf8dac84d # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json

      # On a miss build.sh downloads and sha256-verifies binaryen itself; this
      # only persists the extracted tree between runs.
      - name: Cache binaryen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/binaryen/binaryen-version_131
          key: binaryen-version_131-${{ runner.os }}-${{ runner.arch }}

      - name: Build circuit artifacts
        run: cargo build -p circuits --release

      # ubuntu-latest ships Chrome and ChromeDriver preinstalled, with
      # $CHROMEWEBDRIVER pointing at the driver directory — no browser download.
      # The suite runs UNFILTERED on purpose: a per-test filter previously hid
      # cross-test interference (a leaked window.fetch shim broke 5 of 6 e2e
      # tests only when the whole suite ran).
      #
      # e2e-browser-test.sh owns the rest of the lifecycle: it builds
      # sdk/web/dist when missing, serves it with CORS on E2E_STATIC_ORIGIN,
      # waits for readiness, and raises WASM_BINDGEN_TEST_TIMEOUT (the
      # wasm-bindgen default of 20s cannot cover real proving plus testnet
      # confirmation).
      - name: Run browser e2e tests
        env:
          E2E_STATIC_ORIGIN: http://127.0.0.1:8099
          # Read at COMPILE time via option_env! (sdk/web/src/client/e2e_tests.rs),
          # so these must be set for the cargo invocation, not just at runtime.
          E2E_ACCOUNT_A_ADDRESS: ${{ secrets.E2E_ACCOUNT_A_ADDRESS }}
          E2E_ACCOUNT_A_SECRET: ${{ secrets.E2E_ACCOUNT_A_SECRET }}
          E2E_ACCOUNT_B_ADDRESS: ${{ secrets.E2E_ACCOUNT_B_ADDRESS }}
        run: |
          # $CHROMEWEBDRIVER is set in the runner image's OS environment, so it
          # must be expanded by the shell — `${{ env.CHROMEWEBDRIVER }}` reads the
          # workflow env context instead and would expand to an empty string.
          export CHROMEDRIVER="${CHROMEWEBDRIVER:?CHROMEWEBDRIVER not set by the runner image}/chromedriver"
          test -x "$CHROMEDRIVER" || { echo "chromedriver not executable at $CHROMEDRIVER" >&2; exit 1; }
          # --include-ignored is REQUIRED: the six e2e tests are #[ignore]d by
          # default so the PR-time wasm-test job can run this crate's other tests
          # without secrets or a static server. Without this flag the gate passes
          # having silently skipped every e2e test.
          bash sdk/web/scripts/e2e-browser-test.sh \
            cargo test --target wasm32-unknown-unknown -p stellar-private-payments-sdk-web \
            -- --include-ignored

  publish:
    name: Deploy the app and publish docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The browser e2e must pass before the app can be redeployed (issue #168).
    needs: [docs, e2e]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
