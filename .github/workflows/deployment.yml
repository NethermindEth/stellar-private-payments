name: Deployment

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# GitHub Pages accepts one deployment at a time; queue back-to-back merges
# instead of failing the later deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Site
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache

      - name: Setup pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install mdBook
        run: |
          cargo install mdbook --no-default-features
          cargo install mdbook-mermaid --version 0.17.1 --locked

      - name: Cache binaryen and wasm-opt output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/tmp/binaryen
            target/tmp/witness-opt-cache
          key: binaryen-${{ runner.os }}-${{ runner.arch }}-version_131-bulk-memory-reference-types-multivalue-sign-ext-nontrapping-float-to-int-mutable-globals

      # rust-src: the threaded prover worker rebuilds std from source.
      - name: Install wasm build prerequisites
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
          cargo install wasm-bindgen-cli --version 0.2.128 --locked --force

      - name: Build circuit artifacts
        run: make circuits

      - name: Build app (Trunk)
        run: |
          rm -rf site
          make release DIST_DIR=site PUBLIC_URL="${{ steps.pages.outputs.base_url }}/"

      - name: Publish install script
        run: cp scripts/install.sh site/install.sh

      - name: Resolve symlinks in docs
        run: |
          cd docs/src
          for f in *.md; do
            if [ -L "$f" ]; then
              cp --remove-destination "$(readlink -f "$f")" "$f"
            fi
          done

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_url }}/docs/
        run: |
          mdbook-mermaid install docs/
          mdbook build docs/

      - name: Build API documentation
        run: cargo doc --no-deps --workspace --release

      - name: Combine outputs
        run: |
          rm -f target/doc/.lock
          mkdir -p site/docs/api
          cp -r docs/book/* site/docs/
          cp -r target/doc/* site/docs/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Deploy the app and publish docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
