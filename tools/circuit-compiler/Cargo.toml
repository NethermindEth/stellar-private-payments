[package]
name = "circuit-compiler"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "GPL-3.0"
publish = false

[lib]
name = "circuit_compiler"
path = "src/lib.rs"

[[bin]]
name = "circuit-compiler"
path = "bin/compiler.rs"

[features]
default = []
# Enables circom-witness-rs C++ graph generation (`make witness-graphs`).
regen-graph = ["dep:circom-witness-rs"]

[dependencies]
# workspace
circuit-keys = { workspace = true }

# external
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-circom = { workspace = true, features = ["parallel"] }
ark-groth16 = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
clap = { workspace = true }
compiler = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
constraint_generation = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
constraint_writers = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
parser = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
program_structure = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
regex = "1"
type_analysis = { git = "https://github.com/iden3/circom", tag = "v2.2.3" }
wast = "248.0.0"

# optional
circom-witness-rs = { workspace = true, optional = true, features = ["build-witness"] }

[lints]
workspace = true
