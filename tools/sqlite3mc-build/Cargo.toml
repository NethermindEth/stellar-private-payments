[package]
name = "sqlite3mc-build"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# zip is used by sdk/native/sqlite3mc_source.rs, included with #[path];
# cargo-shear does not follow #[path] modules.
[package.metadata.cargo-shear]
ignored = ["zip"]

[dependencies]
hex = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
