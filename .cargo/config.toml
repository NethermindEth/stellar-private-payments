# The key `circom-groth16-verifier` embeds when no `vk-*` feature is on, so tests
# get a real key; release builds pick the key by feature instead. Not `force`, so
# an exported VERIFIER_VK_JSON, as deploy.sh's verifier builds set, wins.
[env]
VERIFIER_VK_JSON = { value = "testdata/policy_tx_2_2_AB_vk.json", relative = true }

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
rustflags = [
    "-Clink-arg=--initial-memory=67108864",
    "-Clink-arg=--max-memory=4294967296",
]
