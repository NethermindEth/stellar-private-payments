# License policy for the whole workspace, including tools, tests and
# dev-dependencies that are never distributed. Run by scripts/cargo-deny.sh;
# distributed crates are held to the stricter list in deny.toml.
#
# On top of deny.toml's permissive list, this allows copyleft licenses whose
# obligations apply only when the software is distributed. Licenses that
# restrict use itself (AGPL, SSPL, BUSL, non-commercial) stay disallowed.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "wasm32-wasi" },
    { triple = "aarch64-linux-android" },
    { triple = "aarch64-apple-ios" },
]
all-features = true
no-default-features = false

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC-BY-1.0",
    "CC-BY-2.0",
    "CC-BY-3.0",
    "CC-BY-4.0",
    "CC0-1.0",
    "CDLA-Permissive-1.0",
    "CDLA-Permissive-2.0",
    "FTL",
    "GPL-3.0-only",
    "ISC",
    "JSON",
    "LGPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "MS-PL",
    "OpenSSL",
    "PostgreSQL",
    "SHL-0.5",
    "SHL-0.51",
    "TCP-wrappers",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "UPL-1.0",
    "W3C-20150513",
    "WTFPL",
    "Xnet",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = false
registries = []

# The circom compiler crates (https://github.com/iden3/circom) are GPL-3.0 but
# declare no license in their manifests.
[[licenses.clarify]]
crate = "circom_algebra"
expression = "GPL-3.0-only"
license-files = []

