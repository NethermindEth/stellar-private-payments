[package]
name = "circom-groth16-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

# One per key file in deployments/<network>/circuit_keys; build.rs embeds the enabled one.
[features]
vk-testnet-none = []
vk-testnet-a = []
vk-testnet-b = []
vk-testnet-ab = []
vk-testnet-gvk-v = []
vk-testnet-gvk-t = []
vk-testnet-a-gvk-v = []
vk-testnet-a-gvk-t = []
vk-testnet-b-gvk-v = []
vk-testnet-b-gvk-t = []
vk-testnet-ab-gvk-v = []
vk-testnet-ab-gvk-t = []
vk-testnet-keyownership = []

[dependencies]
# workspace
contract-types = { workspace = true }

# external
soroban-sdk = { workspace = true, features = ["alloc"] }

[build-dependencies]
# workspace
circuit-keys = { workspace = true }

# external
ark-bn254 = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# workspace
soroban-utils = { workspace = true }

# external
ark-bn254 = { workspace = true }
ark-circom = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-relations = { workspace = true }
ark-std = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
