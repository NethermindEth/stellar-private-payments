[package]
name = "e2e-tests"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# external
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
# workspace
asp-membership = { workspace = true }
asp-non-membership = { workspace = true }
circom-groth16-verifier = { workspace = true }
# Circuit dependencies
circuits = { workspace = true, features = ["std"] }
# Contract dependencies
contract-types = { workspace = true }
num-bigint = { workspace = true }
pool = { workspace = true }
pool-core = { workspace = true }
pool-gvk = { workspace = true }
public-key-registry = { workspace = true }
soroban-env-host = "=27.0.1"
soroban-sdk = { workspace = true, features = ["testutils"] }
# Shared deps
soroban-utils = { workspace = true, features = ["testutils"] }
stellar-private-payments = { workspace = true, features = ["parallel"] }

[dev-dependencies]
# Serving a pool's real ledger entries back to the SDK's reader.
serde_json = { workspace = true, features = ["std"] }
stellar-xdr = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
