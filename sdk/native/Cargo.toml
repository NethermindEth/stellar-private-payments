[package]
name = "stellar-private-payments"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = true
description = "Stellar Private Payments Rust SDK"
build = "build.rs"

# sqlite-wasm-rs enables the WASM host adapter for rusqlite, and SQLite3MC with `encrypted-storage`.
[package.metadata.cargo-shear]
ignored = ["sqlite-wasm-rs"]

[lib]
name = "stellar_private_payments"

[features]
default = ["encrypted-storage"]
# SQLite3MC-encrypted wallet storage (native and WASM).
encrypted-storage = [
    "rusqlite/in_gecko",
    "sqlite-wasm-rs/sqlite3mc",
    "dep:cc",
    "dep:hkdf",
    "dep:same-file",
    "dep:sqlite3mc-src",
    "dep:windows-sys",
]
# Plaintext wallet storage using rusqlite's bundled SQLite.
unencrypted-storage = ["rusqlite/bundled"]
# multi-threaded proving
parallel = [
    "dep:rayon",
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
]

[target.'cfg(all(not(unix), not(target_arch = "wasm32")))'.dependencies]
same-file = { version = "1.0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-timer = "3"
getrandom = { workspace = true, features = ["std"] }
hkdf = { version = "0.13", optional = true }
rayon = { version = "1.12", default-features = false, optional = true }
reqwest = { workspace = true, features = ["rustls"] }
# The storage features pick the SQLite build: `in_gecko` (`encrypted-storage`) tells
# `libsqlite3-sys` to use the `sqlite3mc` C symbols compiled by `build.rs`, and `bundled`
# (`unencrypted-storage`) compiles plain SQLite.
rusqlite = { workspace = true }
tar = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
gloo-timers = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
sqlite-wasm-rs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bigdecimal = "0.4.11"
circom-witness-rs = { workspace = true }
ed25519-dalek = { workspace = true, features = ["digest", "hazmat", "zeroize"] }
futures = { workspace = true, features = ["executor"] }
getrandom = { workspace = true }
hex = { workspace = true }
http = "1.5.0"
rusqlite_migration = { package = "spp-rusqlite-migration", version = "2.6.0", default-features = false }
serde = { workspace = true }
serde-aux = "4.7.0"
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
sha3 = { version = "0.12", default-features = false }
stellar-strkey = "0.0.18"
stellar-xdr = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
uint = { workspace = true }
web-time = { workspace = true }
zeroize = { workspace = true }

# Arkworks ZK proving
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-poly = { workspace = true }
ark-relations = { workspace = true }
ark-serialize = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
crypto_secretbox.workspace = true
ruint = { workspace = true }
taceo-poseidon2 = { workspace = true }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets"] }

[build-dependencies]
cc = { version = "1", optional = true }
hex = { workspace = true }
sha2 = { workspace = true }
sqlite3mc-src = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
circuit-keys = { workspace = true }
contract-types = { workspace = true }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
pool = { workspace = true }
pool-gvk = { workspace = true }
public-key-registry = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
rusqlite = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
wiremock = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
rusqlite = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "merkle_build"
